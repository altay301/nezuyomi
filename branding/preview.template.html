<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo preview</title>
<style>
  body { margin: 0; padding: 24px; background: #A8A8E0; font: 14px sans-serif; color: #1a1a2e; }
  .row { display: flex; align-items: flex-end; gap: 24px; background: #DDDDDD; padding: 16px;
         border: 2px solid; border-color: #fff #888 #888 #fff; margin-bottom: 20px; }
  .row.dark { background: #2a2a3a; color: #eee; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 4px; font-size: 12px; }
  img { display: block; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .sep { width: 2px; align-self: stretch; background: #888; }
</style>
</head>
<body>
  <h2>App icon — large sizes use the detailed tile, small sizes use the simplified tile</h2>
  <div class="row">
    <figure><img src="logo-tile.svg" width="256" height="256"><figcaption>256</figcaption></figure>
    <figure><img src="logo-tile.svg" width="128" height="128"><figcaption>128</figcaption></figure>
    <figure><img src="logo-tile.svg" width="64" height="64"><figcaption>64</figcaption></figure>
    <div class="sep"></div>
    <figure><img src="logo-tile-small.svg" width="48" height="48"><figcaption>48</figcaption></figure>
    <figure><img src="logo-tile-small.svg" width="32" height="32"><figcaption>32</figcaption></figure>
    <figure><img src="logo-tile-small.svg" width="24" height="24"><figcaption>24</figcaption></figure>
    <figure><img src="logo-tile-small.svg" width="16" height="16"><figcaption>16</figcaption></figure>
  </div>

  <h2>Small sizes: before (detailed) vs after (simplified)</h2>
  <div class="row">
    <figure><img src="logo-tile.svg" width="48" height="48"><figcaption>48 before</figcaption></figure>
    <figure><img src="logo-tile-small.svg" width="48" height="48"><figcaption>48 after</figcaption></figure>
    <div class="sep"></div>
    <figure><img src="logo-tile.svg" width="32" height="32"><figcaption>32 before</figcaption></figure>
    <figure><img src="logo-tile-small.svg" width="32" height="32"><figcaption>32 after</figcaption></figure>
    <div class="sep"></div>
    <figure><img src="logo-tile.svg" width="16" height="16"><figcaption>16 before</figcaption></figure>
    <figure><img src="logo-tile-small.svg" width="16" height="16"><figcaption>16 after</figcaption></figure>
  </div>

  <h2>On a dark panel</h2>
  <div class="row dark">
    <figure><img src="logo-tile.svg" width="128" height="128"><figcaption>128</figcaption></figure>
    <figure><img src="logo-tile-small.svg" width="48" height="48"><figcaption>48</figcaption></figure>
    <figure><img src="logo-tile-small.svg" width="32" height="32"><figcaption>32</figcaption></figure>
    <figure><img src="logo-tile-small.svg" width="16" height="16"><figcaption>16</figcaption></figure>
  </div>

  <h2>Line art (alternative)</h2>
  <div class="row">
    <figure><img src="logo-line.svg" width="256" height="256"><figcaption>256</figcaption></figure>
    <figure><img src="logo-line.svg" width="128" height="128"><figcaption>128</figcaption></figure>
  </div>
</body>
</html>
