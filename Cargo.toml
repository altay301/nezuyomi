[package]
name = "nezuyomi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/altay301/nezuyomi"

[dependencies]
async-channel = "2.5.0"
base64 = "0.23.1"
ego-tree = "0.11.1"
fast_image_resize = "6.2.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2.191"
quick-xml = "0.42.0"
regex = "1.13.2"
rquickjs = "0.14.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
toml = "1.2.2"
ureq = "3.5.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

# Our own crate stays quick to rebuild; dependencies are always optimized
# (image decoding and resizing are unusably slow at opt-level 0).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
